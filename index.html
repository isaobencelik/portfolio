<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBEN CELIK</title>
  <meta name="description" content="Oben Celik, Product Manager in Lisbon. Case studies of my work, and the apps I shipped." />
  <script>
    // the welcome plays once per visit, never with reduced motion (assets/welcome.js)
    (function () {
      try {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches || sessionStorage.getItem('welcome')) return;
        sessionStorage.setItem('welcome', '1');
        document.documentElement.classList.add('welcome');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/dial.css">
  <style>
    :root {
      --bg: #06080B;
      --ink: #F3EFE7;
      --text: #A9AEB6;
      --muted: #6E747D;
      --accent: #D4B483;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    /* the whole homepage fits one screen: svh is the height with the phone's address bar showing */
    body {
      min-height: 100vh; min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--text); }
    a:hover { color: var(--ink); }
    ::selection { background: var(--accent); color: var(--bg); }

    #network-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 1; }
    .vignette {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 70% 65% at 50% 55%, rgba(6,8,11,0.1) 0%, rgba(6,8,11,0.55) 60%, rgba(6,8,11,0.9) 100%);
    }

    .site-header, main, footer { position: relative; z-index: 1; }
    /* The top band: on the first visit of a session a shooting star writes "Welcome to my portfolio"
       in it (assets/welcome.js), then it folds away and the dial grows into the space. --band is
       its height, and the dial's size allows for it (dial.css); the inline script in <head>
       decides whether the welcome plays, before the first paint. */
    @property --band { syntax: '<length>'; inherits: true; initial-value: 0px; }
    :root { --band: 0px; transition: --band .9s var(--ease); }
    :root.welcome { --band: clamp(56px, 10vh, 92px); }
    .site-header { height: var(--band); overflow: hidden; }
    .welcome-sky { position: absolute; left: 0; top: 0; pointer-events: none; }
    @keyframes fade-in { from { opacity: 0; } }
    .hint { animation: fade-in .6s ease 1.1s both; }
    @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }

    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(10px, 2.2vh, 24px); padding: 0 16px 6px;
      /* the dial's sections swing in at an angle, and their square boxes would poke past the screen
         edge for a moment; phones then lay the whole page out wider. Clip sideways only. */
      overflow-x: hidden; overflow-x: clip;
    }
    .intro { text-align: center; display: flex; flex-direction: column; gap: 14px; max-width: 680px; }
    .eyebrow { margin: 0; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font-size: clamp(30px, 4.6vw, 54px); font-weight: 300; line-height: 1.04; letter-spacing: -0.025em; color: var(--ink); }

    .hint { margin: 0; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); text-align: center; min-height: 1.4em; }
    footer { padding: 0 16px clamp(8px, 1.6vh, 20px); text-align: center; font-size: 11px; color: #4C525A; letter-spacing: 0.04em; }

  </style>
</head>
<body>
  <canvas id="network-bg" data-rgb="212, 180, 131" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="site-header" aria-hidden="true"></header>

  <main>
    <h1 class="sr-only">Oben Celik, Product Manager</h1>

    <div class="dial" id="dial" data-label="gold">
      <div class="dial-glow" aria-hidden="true"></div>
      <div class="dial-ring" aria-hidden="true"></div>
      <div class="dial-glass" aria-hidden="true"></div>
      <div class="ticks morph" id="ticks" aria-hidden="true"></div>
      <nav class="dial-nav" id="dial-nav" aria-label="Explore"></nav>
      <div class="core morph" id="core" aria-live="polite">
        <div class="core-inner" id="core-inner">
          <span class="core-title" id="core-title"></span>
          <span class="core-text" id="core-text"></span>
          <span class="core-meta" id="core-meta"></span>
          <button type="button" class="core-back" id="core-back" hidden>Close</button>
        </div>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </main>

  <footer>&copy; 2026 Oben Celik</footer>

  <script src="assets/network-bg.js"></script>
  <script src="assets/dial.js"></script>
  <script src="assets/welcome.js"></script>
</body>
</html>
