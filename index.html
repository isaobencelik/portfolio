<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBEN CELIK</title>
  <meta name="description" content="Oben Celik, Product Owner in Lisbon. Case studies of product work, and the apps I build." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080B;
      --ink: #F3EFE7;
      --text: #A9AEB6;
      --muted: #6E747D;
      --accent: #D4B483;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--text); }
    a:hover { color: var(--ink); }
    ::selection { background: var(--accent); color: var(--bg); }

    #network-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.55; }
    .vignette {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 70% 65% at 50% 55%, rgba(6,8,11,0.1) 0%, rgba(6,8,11,0.55) 60%, rgba(6,8,11,0.9) 100%);
    }

    .site-header, main, footer { position: relative; z-index: 1; }
    .site-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;
      padding: 20px clamp(16px, 4vw, 56px);
    }
    .brand { text-decoration: none; font-size: 15px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink); padding: 10px 0; }
    .site-nav { display: flex; flex-wrap: wrap; gap: 4px 32px; font-size: 13px; letter-spacing: 0.04em; }
    .site-nav a { text-decoration: none; padding: 12px 0; }

    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 8px 16px 40px;
    }
    .intro { text-align: center; display: flex; flex-direction: column; gap: 14px; max-width: 680px; }
    .eyebrow { margin: 0; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font-size: clamp(30px, 4.6vw, 54px); font-weight: 300; line-height: 1.04; letter-spacing: -0.025em; color: var(--ink); }

    /* ---------- Dial ---------- */
    .dial { position: relative; width: min(620px, 92vw, max(340px, calc(100vh - 320px))); aspect-ratio: 1 / 1; }
    .dial-glow { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(212,180,131,0.07) 0%, transparent 68%); pointer-events: none; }
    .dial-ring { position: absolute; inset: -2.5%; border-radius: 50%; border: 1px solid rgba(243,239,231,0.07); pointer-events: none; }
    .ticks {
      position: absolute; border-radius: 50%; pointer-events: none;
      background: repeating-conic-gradient(rgba(212,180,131,0.35) 0deg 0.5deg, transparent 0.5deg 6deg);
      -webkit-mask: radial-gradient(closest-side, transparent 90%, #000 91%, #000 97%, transparent 98%);
      mask: radial-gradient(closest-side, transparent 90%, #000 91%, #000 97%, transparent 98%);
      animation: spin 120s linear infinite;
    }
    .dial-nav { position: absolute; inset: 0; }
    .wedge {
      position: absolute; inset: 0; width: 100%; height: 100%;
      margin: 0; padding: 0; border: 0; font: inherit; text-align: center; text-decoration: none; cursor: pointer;
      background-color: rgba(255,255,255,0.035);
      color: #E6E1D8;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: clip-path .6s var(--ease), background-color .25s ease, color .25s ease;
      outline: none;
    }
    .wedge:focus-visible { background-color: rgba(255,255,255,0.1); }
    .wedge .edge { position: absolute; inset: 0; background: var(--accent); opacity: 0; transition: clip-path .6s var(--ease), opacity .25s ease; }
    .wedge .lbl {
      position: absolute; transform: translate(-50%, -50%);
      font-weight: 400; text-transform: uppercase; line-height: 1.3;
      transition: left .6s var(--ease), top .6s var(--ease), transform .6s var(--ease), opacity .35s ease;
    }
    .morph { transition: left .6s var(--ease), top .6s var(--ease), width .6s var(--ease), height .6s var(--ease), border-color .25s ease; }

    .core {
      position: absolute; border-radius: 50%;
      background: rgba(9,12,16,0.78);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border: 1px solid rgba(243,239,231,0.12);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      text-align: center; padding: 0 9%;
    }
    .core-status { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: #8A8F98; display: flex; align-items: center; gap: 8px; }
    .core-dot { width: 5px; height: 5px; border-radius: 50%; }
    .core-title { font-size: clamp(20px, 3vw, 30px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.08; color: var(--ink); }
    .core-text { font-size: clamp(11px, 1.5vw, 13px); line-height: 1.5; color: var(--text); }
    .core-meta { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); }
    .core-back {
      margin-top: 2px; min-height: 36px; padding: 0 18px; border-radius: 18px;
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      font-family: 'Geist', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    }
    .core-back:hover { background: rgba(212,180,131,0.1); }
    .core-back[hidden] { display: none; }

    .hint { margin: 0; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); text-align: center; min-height: 1.4em; }
    footer { padding: 0 16px 28px; text-align: center; font-size: 11px; color: #4C525A; letter-spacing: 0.04em; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .ticks { animation: none; }
      .wedge, .wedge .edge, .wedge .lbl, .morph { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="network-bg" data-rgb="212, 180, 131" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">Oben Celik</a>
    <nav class="site-nav" aria-label="Main">
      <a href="case-studies.html">Case studies</a>
      <a href="apps.html">My apps</a>
      <a href="about.html">About</a>
      <a href="Oben_Celik_CV.pdf" download>CV</a>
      <a href="mailto:isaobencelik@gmail.com">Contact</a>
    </nav>
  </header>

  <main>
    <div class="intro">
      <p class="eyebrow">Product Owner · Lisbon</p>
      <h1>I plan products, then build small ones.</h1>
    </div>

    <div class="dial" id="dial">
      <div class="dial-glow" aria-hidden="true"></div>
      <div class="dial-ring" aria-hidden="true"></div>
      <div class="ticks morph" id="ticks" aria-hidden="true"></div>
      <nav class="dial-nav" id="dial-nav" aria-label="Explore"></nav>
      <div class="core morph" id="core" aria-live="polite">
        <span class="core-status"><span class="core-dot" id="core-dot"></span><span id="core-status"></span></span>
        <span class="core-title" id="core-title"></span>
        <span class="core-text" id="core-text"></span>
        <span class="core-meta" id="core-meta"></span>
        <button type="button" class="core-back" id="core-back" hidden>Close</button>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </main>

  <footer>&copy; 2026 Oben Celik</footer>

  <script src="assets/network-bg.js"></script>
  <script src="assets/dial.js"></script>
</body>
</html>
